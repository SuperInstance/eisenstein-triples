[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
license = "MIT"
name = "eisenstein-triples"
version = "0.1.0"
description = "Eisenstein integer triples — generation, analysis, and proof verification on hexagonal lattices"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
eisenstein-triples = "eisenstein_triples:__main__"
